[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "projektguard"
version = "0.1.1"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8,<3",
]

[project.scripts]
projektguard-benchmark = "projektguard.benchmark.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
