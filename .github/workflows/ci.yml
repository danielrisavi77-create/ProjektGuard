name: CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Evidence Integrity slice gate
        run: python -m projektguard.dev.slice_gate evidence-integrity
