name: CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test with coverage
        run: python -m pytest --cov=projektguard --cov-report=term --cov-fail-under=90

      - name: Benchmark acceptance gate
        run: projektguard-benchmark --manifest benchmark/financial_integrity_core/manifest.json --json-output benchmark-summary.json
